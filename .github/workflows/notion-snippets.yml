name: Sync snippets to Notion

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # "ref" targets read older commits
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-snippets.mjs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
