name: Notion snippets

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        options: [plan, apply, force]
        default: apply

permissions:
  contents: read

concurrency:
  group: notion-snippets-${{ github.ref }}

jobs:
  sync:
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && github.actor != 'dependabot[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: app
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ vars.AUTOMATION_APP_ID }}
          private-key: ${{ secrets.AUTOMATION_APP_KEY }}
          repositories: claude-plugins
      - uses: actions/checkout@v4
        with:
          repository: MgCohen/claude-plugins
          ref: ${{ vars.NOTION_TOOLS_REF || 'main' }}
          token: ${{ steps.app.outputs.token }}
          path: .notion-tools
          sparse-checkout: plugins/notion-context
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m notion_context snippets ${{ github.event_name == 'pull_request' && 'plan' || inputs.mode || 'apply' }}
        env:
          PYTHONPATH: .notion-tools/plugins/notion-context
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_SNIPPETS_DATABASE: ${{ vars.NOTION_SNIPPETS_DATABASE }}
